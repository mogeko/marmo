name: Fuzz

# PR-only smoke: the nine targets share one job so the runner installs
# cargo-fuzz and builds the dependency graph once. Long runs stay manual
# (`workflow_dispatch` or locally);
on:
  pull_request:
    branches: [master]
    paths:
      - "crates/marmo-proto/src/**"
      - "crates/marmo-net/src/**"
      - "fuzz/**"
      - Cargo.lock
      - Cargo.toml
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo +stable install cargo-fuzz --locked
      - name: Fuzz every decoder
        shell: bash
        run: |
          set -euo pipefail
          for target in ss2022_tcp ss2022_udp socks5 sniff trojan vless vmess mux http; do
            echo "::group::Fuzzing ${target}"
            cargo +nightly fuzz run "${target}" -- -runs=1000 -max_len=4096 -timeout=25
            echo "::endgroup::"
          done
