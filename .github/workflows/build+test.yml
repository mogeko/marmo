name: Build & Test

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - run: zig fmt --check build.zig src tests packages
      - run: zig build --summary all
      - run: zig build test --summary all
      - name: Test packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for build in packages/*/build.zig; do
            dir="${build%/build.zig}"
            echo "::group::Testing ${dir}"
            (cd "${dir}" && zig build test)
            echo "::endgroup::"
          done

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - name: Format examples
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for build in examples/*/build.zig; do
            dir="${build%/build.zig}"
            echo "::group::Formatting ${dir}"
            zig fmt --check "${dir}"
            echo "::endgroup::"
          done
      - name: Build examples
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for build in examples/*/build.zig; do
            dir="${build%/build.zig}"
            echo "::group::Building ${dir}"
            (cd "${dir}" && zig build)
            echo "::endgroup::"
          done
