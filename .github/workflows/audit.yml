name: Dependencies

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/*/Cargo.toml"
      - .github/workflows/audit.yml
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/*/Cargo.toml"
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Reject copyleft dependencies
        run: |
          set -euo pipefail
          if cargo tree --workspace --locked --format '{l}' | grep -Eiq 'GPL|MPL'; then
            echo "copyleft dependency detected; see docs/decisions/0020-license.md" >&2
            exit 1
          fi
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
