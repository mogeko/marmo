[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mogeko/marmo"
authors = ["Zheng Junyi"]

[workspace.dependencies]
marmo-net = { path = "crates/marmo-net" }
marmo-proto = { path = "crates/marmo-proto" }
marmo-transport = { path = "crates/marmo-transport" }
aes = "0.9"
aes-gcm = "0.11"
base64 = "0.22"
blake3 = "1.8"
httparse = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
thiserror = "2.0"
tokio = { version = "1.54", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
