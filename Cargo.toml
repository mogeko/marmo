[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mogeko/marmo"
authors = ["Zheng Junyi"]

[workspace.dependencies]
aho-corasick = "1"
marmo-net = { path = "crates/marmo-net", version = "=0.0.3" }
marmo-proto = { path = "crates/marmo-proto", version = "=0.0.3" }
marmo-transport = { path = "crates/marmo-transport", version = "=0.0.3" }
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "logging",
    "std",
] }
rustls-pki-types = "1.16"
rustls-platform-verifier = "0.7"
aes = "0.9"
aes-gcm = "0.11"
base64 = "0.22"
blake3 = "1.8"
bytes = "1"
chacha20poly1305 = { version = "0.11", default-features = false }
getrandom = "0.4"
h2 = "0.4"
hmac = { version = "0.12", default-features = false }
http = "1"
httparse = "1.10"
md-5 = { version = "0.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
proptest = "1.6"
sha2 = "0.10"
sha3 = { version = "0.10", default-features = false }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.54", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws_lc_rs",
    "logging",
] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1.9"
ws-net = { version = "0.10", features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
