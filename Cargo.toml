[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mogeko/marmo"
authors = ["Zheng Junyi"]

[workspace.dependencies]
thiserror = "2.0"
tokio = { version = "1.54", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
